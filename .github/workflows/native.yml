name: Native

# Runner budget: the wvlet org's Free plan runs at most 20 jobs (5 macOS) at once, shared by
# every PR and every push to main. So the full platform matrix (mac, linux-arm64, Windows)
# runs nightly and on manual dispatch, not on each merge; pushes to main build linux-x64 only,
# and pull requests build linux-x64 only when they touch wvc-lib or the native build setup.
# To check a branch on every platform: gh workflow run native.yml --ref <branch>
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# Cancel a pull request's older run when a new commit (e.g., a rebase) arrives; runs on main
# get a group of their own (run_id), so none of them is cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Nix / Chocolatey sbt launchers default to a 1 GB heap, which Scala Native's codegen for
  # wvc-lib (which links wvlet-engine through the runner) outgrows: its live heap peaks at ~2 GB.
  # 4 GB leaves headroom while fitting the smallest runner (macos-latest, 7 GB RAM).
  SBT_OPTS: -Xmx4g -Xss4m

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        # Schedule payloads have no default branch to diff against, and the full runs read no filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        id: filter
        with:
          filters: |
            src:
              - '.github/workflows/native.yml'
              - 'project/**'
              - '**.scala'
              - '**.sbt'
              - '**.conf'
              - '**.wv'
              - 'flake.nix'
              - 'flake.lock'
              - SCALA_VERSION
            # Pull requests build the library only for these; the "Scala Native" job in
            # test.yml already compiles wvc-lib with the rest of projectNative
            wvc_lib:
              - '.github/workflows/native.yml'
              - 'wvc-lib/**'
              - 'project/**'
              - '**.sbt'
              - 'flake.nix'
              - 'flake.lock'
              - SCALA_VERSION
      - name: Plan platforms
        id: plan
        # Lists only the platforms that run, so a skipped platform never takes a runner
        env:
          EVENT: ${{ github.event_name }}
          SRC: ${{ steps.filter.outputs.src }}
          WVC_LIB: ${{ steps.filter.outputs.wvc_lib }}
        run: |
          full=false
          linux_x64=false
          case "$EVENT" in
            schedule|workflow_dispatch) full=true; linux_x64=true ;;
            push) linux_x64=$SRC ;;
            pull_request) linux_x64=$WVC_LIB ;;
          esac
          entries=()
          if [ "$full" = true ]; then
            entries+=('{"os":"macos-latest","arch":"arm64","name":"mac","suffix":"dylib"}')
            entries+=('{"os":"ubuntu-24.04-arm","arch":"arm64","name":"linux","suffix":"so"}')
          fi
          if [ "$linux_x64" = true ]; then
            entries+=('{"os":"ubuntu-latest","arch":"x64","name":"linux","suffix":"so"}')
          fi
          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "full=$full matrix=$matrix"
  build_native:
    name: Build native on ${{ matrix.name }}-${{ matrix.arch }}
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          # Linux x64 runs on main and on PRs, so it restores the shared cache built by sbt-cache.yml
          # instead of saving its own; the other runners only run nightly and keep setup-java's.
          cache: ${{ matrix.os != 'ubuntu-latest' && 'sbt' || '' }}
      - uses: ./.github/actions/sbt-cache
        if: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-24.11
      - name: Set SCALA_VERSION env
        run: |
          SCALA_VERSION=$(cat SCALA_VERSION)
          echo SCALA_VERSION: $SCALA_VERSION
          echo "SCALA_VERSION=$SCALA_VERSION" >> $GITHUB_ENV
      - name: Build native binary
        run: |
          nix develop .#ci --command sbt wvcLib/nativeLinkReleaseFast
      - name: Ad-hoc sign macOS library
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "Signing macOS library with ad-hoc signature..."
          # Sign the library
          codesign --sign - --force target/out/native0.5/scala-${{ env.SCALA_VERSION }}/wvc-lib/libwvlet.dylib

          # Remove quarantine attribute if present
          xattr -cr target/out/native0.5/scala-${{ env.SCALA_VERSION }}/wvc-lib/libwvlet.dylib || true

          # Verify signature
          codesign --verify --verbose target/out/native0.5/scala-${{ env.SCALA_VERSION }}/wvc-lib/libwvlet.dylib

          # Display signature info
          codesign --display --verbose=2 target/out/native0.5/scala-${{ env.SCALA_VERSION }}/wvc-lib/libwvlet.dylib
      - name: Install Rust for native tests
        if: ${{ runner.os == 'Linux' }}
        run: rustup update
      - name: Test native library
        run: |
          echo "Testing native library..."
          nix develop .#ci --command make test
        working-directory: wvc-lib
      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-${{ matrix.arch }}
          path: target/out/native0.5/scala-${{ env.SCALA_VERSION }}/wvc-lib/libwvlet.${{ matrix.suffix }}
          # Full runs merge (and delete) these into wvc-lib; keep linux-x64-only uploads briefly
          retention-days: ${{ needs.changes.outputs.full == 'true' && 90 || 3 }}

  build_windows:
    name: Build native on Windows (${{ matrix.arch }})
    needs: changes
    # Only in the nightly run, or on manual dispatch (to verify a branch on every platform)
    if: ${{ needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target_triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: sbt
      - name: Install sbt
        run: |
          choco install sbt -y
      - name: Install LLVM and Clang
        run: |
          # Download LLVM directly instead of using Chocolatey: the Chocolatey package lags
          # behind (Clang 20) and has no ARM64 build, while the MSVC STL on the runner
          # (14.52+) requires Clang 22 or newer (STL1000)
          $llvmVersion = "22.1.8"
          $installer = if ("${{ matrix.arch }}" -eq "arm64") { "woa64" } else { "win64" }
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-$installer.exe"
          Write-Host "Downloading LLVM $llvmVersion ($installer)..."
          Invoke-WebRequest -Uri $url -OutFile "llvm-installer.exe"
          Write-Host "Installing LLVM..."
          $proc = Start-Process -FilePath ".\llvm-installer.exe" -ArgumentList "/S","/D=C:\Program Files\LLVM" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($proc.ExitCode)" }
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          # windows-latest preinstalls an older LLVM in the same folder; fail here, not in sbt
          $clangVersion = & "C:\Program Files\LLVM\bin\clang.exe" --version | Out-String
          Write-Host $clangVersion
          if ($clangVersion -notmatch "clang version $([regex]::Escape($llvmVersion))") {
            throw "Expected clang $llvmVersion"
          }
        shell: pwsh
      # Cache vcpkg compiled libraries to avoid rebuilding OpenSSL etc. every time
      - name: Cache vcpkg artifacts
        uses: actions/cache@v6
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-bdwgc-zlib-openssl-duckdb-curl-v1
      - name: Install native dependencies (Boehm GC, zlib, OpenSSL, DuckDB, curl)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "arm64") { "arm64-windows" } else { "x64-windows" }
          vcpkg install bdwgc:$triplet zlib:$triplet openssl:$triplet duckdb:$triplet curl:$triplet
        shell: pwsh
      - name: Configure paths and symlinks
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "arm64") { "arm64-windows" } else { "x64-windows" }
          $libDir = "$env:VCPKG_INSTALLATION_ROOT\installed\$triplet\lib"

          # Scala Native passes @link("X") to the linker as literal `X.lib`. vcpkg's Windows
          # ports install some libs with a different name (upstream convention), so for each
          # canonical name Scala Native asks for, copy the first candidate that exists:
          #   - crypto.lib / ssl.lib  <- OpenSSL (libcrypto.lib / libssl.lib)
          #   - curl.lib              <- libcurl (libcurl.lib, from uni's CurlBindings)
          #   - zlib.lib              <- zlib    (varies by port revision: zlib1.lib / z.lib / libz.lib)
          $targets = [ordered]@{
            "crypto.lib" = @("libcrypto.lib")
            "ssl.lib"    = @("libssl.lib")
            "curl.lib"   = @("libcurl.lib")
            "zlib.lib"   = @("zlib1.lib", "z.lib", "libz.lib", "libzlib.lib")
          }
          foreach ($dst in $targets.Keys) {
            $dstPath = Join-Path $libDir $dst
            if (Test-Path $dstPath) { continue }
            foreach ($src in $targets[$dst]) {
              $srcPath = Join-Path $libDir $src
              if (Test-Path $srcPath) {
                Write-Host "Copying $src -> $dst"
                Copy-Item $srcPath $dstPath -Force
                break
              }
            }
          }

          # Log the lib directory contents so we can diagnose future missing-lib errors.
          Write-Host "Contents of ${libDir}:"
          Get-ChildItem -Path $libDir -Filter *.lib -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object

          echo "C_INCLUDE_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet\include" >> $env:GITHUB_ENV
          echo "VCPKG_LIB_PATH=$libDir" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Set SCALA_VERSION env
        run: |
          $scalaVersion = Get-Content SCALA_VERSION -Raw
          $scalaVersion = $scalaVersion.Trim()
          echo "SCALA_VERSION=$scalaVersion" >> $env:GITHUB_ENV
          echo "SCALA_VERSION: $scalaVersion"
          # Set target triple for Scala Native
          echo "SCALANATIVE_TARGET_TRIPLE=${{ matrix.target_triple }}" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Build native binary
        run: |
          echo "Target triple: %SCALANATIVE_TARGET_TRIPLE%"
          set "LIB=%VCPKG_LIB_PATH%;%LIB%"
          echo "LIB: %LIB%"
          sbt wvcLib/nativeLinkReleaseFast
        shell: cmd
      - name: List build outputs
        run: |
          dir target\out\native0.5\scala-${{ env.SCALA_VERSION }}\wvc-lib\
        shell: cmd
      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          # Windows doesn't use lib prefix - Scala Native generates wvlet.dll
          path: target/out/native0.5/scala-${{ env.SCALA_VERSION }}/wvc-lib/wvlet.dll

  collect_artifact:
    name: Collect wvc dll
    runs-on: ubuntu-latest
    needs: [changes, build_native, build_windows]
    # Only for the full matrix: python-publish.yml packages the newest wvc-lib artifact, so a
    # linux-x64-only run must not publish one. Still runs when some platforms failed.
    if: ${{ always() && needs.changes.outputs.full == 'true' && (needs.build_native.result == 'success' || needs.build_windows.result == 'success') }}
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: wvc-lib
          delete-merged: true
          separate-directories: true
