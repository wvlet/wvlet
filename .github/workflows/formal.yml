name: Formal

on:
  pull_request:
    paths:
      - '.github/workflows/formal.yml'
      - 'formal/**'
      - 'wvlet-runner/src/main/scala/wvlet/lang/runner/activity/**'
      - 'wvlet-runner/.jvm/src/main/scala/wvlet/lang/runner/activity/**'
      - 'wvlet-runner/.jvm/src/test/resources/wvlet/lang/runner/activity/**'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/typer/TypeInference.scala'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/typer/TyperRules.scala'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/typer/**'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/pipeline/ModelOrder.scala'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/pipeline/ModelBuild.scala'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/pipeline/**'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/codegen/SqlGenerator.scala'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/codegen/sql-fold-traces.json'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/transform/RewriteExpr.scala'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/transform/**'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/Scope.scala'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/Context.scala'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/GlobalSymbolIndex.scala'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/typer/TyperRules.scala'
      - 'wvlet-lang/src/main/scala/wvlet/lang/compiler/analyzer/RelationRefResolver.scala'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/lookup/**'
      - 'wvlet-engine/src/main/scala/wvlet/lang/engine/runtime/PushDownFilters.scala'
      - 'wvlet-engine/.jvm/src/test/resources/wvlet/lang/engine/runtime/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/formal.yml'
      - 'formal/**'
      - 'wvlet-runner/.jvm/src/test/resources/wvlet/lang/runner/activity/**'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/typer/**'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/pipeline/**'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/codegen/sql-fold-traces.json'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/transform/**'
      - 'wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/lookup/**'
      - 'wvlet-engine/.jvm/src/test/resources/wvlet/lang/engine/runtime/**'
  workflow_dispatch:

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            formal/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}
      # elan-init.sh is pinned to a release tag; lean-toolchain selects the Lean version
      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_VERSION}/elan-init.sh" \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # --wfail turns every warning, including "declaration uses 'sorry'", into an error
      - name: Check proofs
        run: lake build --wfail
      - name: Check activity conformance fixture freshness
        run: |
          lake exe activity-traces
          git diff --exit-code -- ../wvlet-runner/.jvm/src/test/resources/wvlet/lang/runner/activity/ \
            || (echo "::error::The activity conformance fixture is stale. Run 'cd formal && lake exe activity-traces' and commit the result." && exit 1)
      - name: Check typer conformance fixture freshness
        run: |
          lake exe typer-traces
          git diff --exit-code -- ../wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/typer/ \
            || (echo "::error::The typer conformance fixture is stale. Run 'cd formal && lake exe typer-traces' and commit the result." && exit 1)
      - name: Check operator typing conformance fixture freshness
        run: |
          lake exe operator-traces
          git diff --exit-code -- ../wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/typer/operator-traces.json \
            || (echo "::error::The operator typing conformance fixture is stale. Run 'cd formal && lake exe operator-traces' and commit the result." && exit 1)
      - name: Check model build conformance fixture freshness
        run: |
          lake exe model-build-traces
          git diff --exit-code -- ../wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/pipeline/ \
            || (echo "::error::The model build conformance fixture is stale. Run 'cd formal && lake exe model-build-traces' and commit the result." && exit 1)
      - name: Check SQL block folding conformance fixture freshness
        run: |
          lake exe sql-fold-traces
          git diff --exit-code -- ../wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/codegen/sql-fold-traces.json \
            || (echo "::error::The SQL block folding conformance fixture is stale. Run 'cd formal && lake exe sql-fold-traces' and commit the result." && exit 1)
      - name: Check expression rewrite conformance fixture freshness
        run: |
          lake exe rewrite-expr-traces
          git diff --exit-code -- ../wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/transform/ \
            || (echo "::error::The expression rewrite conformance fixture is stale. Run 'cd formal && lake exe rewrite-expr-traces' and commit the result." && exit 1)
      - name: Check name lookup conformance fixture freshness
        run: |
          lake exe name-lookup-traces
          git diff --exit-code -- ../wvlet-lang/.jvm/src/test/resources/wvlet/lang/compiler/lookup/ \
            || (echo "::error::The name lookup conformance fixture is stale. Run 'cd formal && lake exe name-lookup-traces' and commit the result." && exit 1)
      - name: Check filter pushdown conformance fixture freshness
        run: |
          lake exe pushdown-filter-traces
          git diff --exit-code -- ../wvlet-engine/.jvm/src/test/resources/wvlet/lang/engine/runtime/ \
            || (echo "::error::The filter pushdown conformance fixture is stale. Run 'cd formal && lake exe pushdown-filter-traces' and commit the result." && exit 1)
