name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel a pull request's older run when a new commit (e.g., a rebase) arrives; other runs get a
# group of their own (run_id), so pushes to main and tags are never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - '.github/workflows/test.yml'
              # The Scala.js job smoke-tests the CLI package built by this script
              - '.github/scripts/add-jlink-runtime.sh'
              - 'project/**'
              - '**.scala'
              - '**.sbt'
              - '**.conf'
              - 'wvlet-*/**.json'
              - '**.wv'
              - 'wvlet-*/**.js'
              - 'wvlet-*/**.html'
              - 'wvlet-*/**.css'
              - 'wvlet-*/**.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - SCALA_VERSION
              # The bundled AI-agent skill is compiled and run by SkillSnippetTest
              - 'plugins/**'
              # AdrIndexTest checks the ADR index order and completeness
              - 'adr/**'
              - 'website/docs/for-ai-agents.md'
  code_format:
    name: Code format
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sbt-cache
      - name: scalafmt
        run: ./sbt scalafmtCheckAll
  test_scala_3:
    name: Scala 3
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-cache
      - name: Scala 3.x test
        run: ./sbt projectJVM/test
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          check_name: Test Report Scala 3.x
          annotate_only: true
          detailed_summary: true
  test_js:
    name: Scala.js
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Install libduckdb
        # Required by wvlet-lang.js's DuckDB backend (koffi loads libduckdb via FFI).
        # Pull the prebuilt artifact from DuckDB's GitHub release into /usr/local/lib so
        # koffi finds it. Version pinned via the DUCKDB_VERSION file at the repo root.
        run: |
          DUCKDB_VERSION=$(cat DUCKDB_VERSION)
          curl -sSfL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          mkdir -p /tmp/libduckdb && unzip -q /tmp/libduckdb.zip -d /tmp/libduckdb
          sudo cp /tmp/libduckdb/libduckdb.so /usr/local/lib/
          sudo ldconfig
      - name: Scala.js test
        run: JVM_OPTS=-Xmx4g ./sbt "projectJS/test"
      - name: Packaging wvlet-cli and wvlet-cli-full
        run: JVM_OPTS=-Xmx4g ./sbt "cli/packArchiveTgz" "cliFull/packArchiveTgz"
      - name: Smoke-test wvlet-cli with its jlink'd runtime
        # Fails when a new dependency needs a JDK module that the release's platform packages
        # leave out. See design/releasing.md
        run: |
          .github/scripts/add-jlink-runtime.sh wvlet-cli/target/wvlet-cli-*.tar.gz \
            target/wvlet-cli-linux-x64.tar.gz
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          check_name: Test Report Scala.js
          annotate_only: true
          detailed_summary: true
  test_playground:
    name: Playground
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Scala.js
        run: JVM_OPTS=-Xmx4g ./sbt "playground/fullLinkJS"
      - name: Build playground web site
        run: pnpm run build-playground
  test_native:
    name: Scala Native
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-cache
      - name: Install native dependencies
        # libcurl4-openssl-dev provides the unversioned libcurl.so symlink that the linker
        # needs when @link("curl") (via uni's CurlBindings) becomes reachable through the
        # cross-platform Trino client.
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Scala Native test
        # Runs without libduckdb, as the native CLI ships: DuckDB-backed tests skip themselves
        # (DuckDB.canExecute / isAvailable) and the "libduckdb is not available" fallback tests
        # run. DuckDB itself is covered by the JVM and Scala.js jobs.
        run: ./sbt projectNative/test
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          check_name: Test Report Scala Native
          annotate_only: true
          detailed_summary: true
  # Workflows that also run on their own (dispatch, release tags) are called here, so their jobs
  # report to "CI passed" below. Each one applies its own path filter.
  doc:
    name: Doc
    uses: ./.github/workflows/test-doc.yml
    permissions:
      contents: read
      pull-requests: read
  vscode:
    name: VS Code
    uses: ./.github/workflows/vscode-extension.yml
    permissions:
      contents: read
      pull-requests: read
  highlightjs:
    name: highlight.js
    uses: ./.github/workflows/highlightjs.yml
    permissions:
      contents: read
      pull-requests: read
  prismjs:
    name: Prism.js
    uses: ./.github/workflows/prismjs.yml
    permissions:
      contents: read
      pull-requests: read
  # The only required status check in the main ruleset. It fails when any job above failed or
  # was cancelled; jobs skipped by a path filter count as passing. Add new PR jobs to `needs`.
  ci_passed:
    name: CI passed
    if: ${{ always() }}
    needs:
      - changes
      - code_format
      - test_scala_3
      - test_js
      - test_playground
      - test_native
      - doc
      - vscode
      - highlightjs
      - prismjs
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled: $failed"
            exit 1
          fi
