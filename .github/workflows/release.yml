name: Release

# Every v* tag creates the GitHub release with the CLI archives, opens the Homebrew PR, and
# publishes the Scala library modules to the wvlet Maven repository (https://repo.wvlet.org/maven2,
# Cloudflare R2, shared with uni and airframe). See design/releasing.md.

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Stage and sign the Maven artifacts and attach them to the run, without uploading to repo.wvlet.org. Turn off only on a v* tag to (re-)publish it.'
        type: boolean
        default: true

env:
  R2_BUCKET: wvlet-maven
  R2_PREFIX: maven2

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    name: Create a new release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        # We need to fetch all tags to get the latest tag
        with:
         fetch-depth: 0
      - name: Create a release note
        run: |
          gh release view "$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY" | \
          # Create a new release note only when the release note is not created yet
          gh release create "$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY" --generate-notes
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '22'
      - uses: ./.github/actions/sbt-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build wvlet-cli and wvlet-cli-full
        # The lite CLI (default, also used by Homebrew) and the full CLI with the optional
        # DuckDB and Snowflake connectors
        run: ./sbt cli/packArchiveTgz cliFull/packArchiveTgz
      - name: Get the release version name
        run: |
          # Strip v from tag name
          VERSION=${GITHUB_REF_NAME#v}
          echo Version: $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Upload wvlet-cli-(version).tar.gz and wvlet-cli-full-(version).tar.gz to GitHub release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
          "wvlet-cli/target/wvlet-cli-${VERSION}.tar.gz" \
          "wvlet-cli-full/target/wvlet-cli-full-${VERSION}.tar.gz" \
          --clobber --repo="$GITHUB_REPOSITORY"
  platform_packages:
    # wvlet-cli-(version)-(os)-(arch).tar.gz: the lite CLI plus a jlink'd Java runtime, so that
    # Homebrew needs no openjdk formula. Each runtime is linked and smoke-tested on its own
    # platform. See design/releasing.md.
    name: Package wvlet-cli for ${{ matrix.platform }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build and upload wvlet-cli-(version)-${{ matrix.platform }}.tar.gz
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p target/release
          gh release download "$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY" \
            --pattern "wvlet-cli-${VERSION}.tar.gz" --dir target/release
          .github/scripts/add-jlink-runtime.sh "target/release/wvlet-cli-${VERSION}.tar.gz" \
            "target/release/wvlet-cli-${VERSION}-${{ matrix.platform }}.tar.gz"
          gh release upload "$GITHUB_REF_NAME" \
            "target/release/wvlet-cli-${VERSION}-${{ matrix.platform }}.tar.gz" \
            --clobber --repo="$GITHUB_REPOSITORY"
  publish:
    name: Publish to repo.wvlet.org
    runs-on: ubuntu-latest
    # Stages the signed artifacts of projectPublish (the library modules listed in build.sbt) into
    # target/sona-staging, then uploads that tree. A version already in the bucket is never
    # overwritten, and artifacts go up before maven-metadata.xml. Independent of the release job,
    # so a failed publish does not block the CLI release or Homebrew.
    #
    # Credentials are scoped to the steps that need them, never exposed to third-party actions.
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Refuse to publish a ref that is not a release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && env.DRY_RUN != 'true' }}
        run: |
          echo "::error::Only a v* tag can be published; run with dry_run to test a branch"
          exit 1
      - uses: actions/checkout@v7
        with:
          # Fetch all tags so that sbt-dynver derives the version from the release tag
          fetch-depth: 0
      - run: git fetch --tags -f
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '22'
      - uses: ./.github/actions/sbt-cache
      - name: Setup GPG
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: echo "$PGP_SECRET" | base64 --decode | gpg --import --batch --yes
      - name: Stage signed artifacts
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: ./sbt "show version" projectPublish/publishSigned
      - name: Check the staged files (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          mkdir -p target/empty-repo
          python3 .github/scripts/maven_repo.py check target/sona-staging target/empty-repo
          python3 .github/scripts/maven_repo.py metadata target/sona-staging target/sona-staging target/repo-metadata
          find target/sona-staging -type f | sort
          du -sh target/sona-staging
      - name: Attach the staged files to the run (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sona-staging
          path: |
            target/sona-staging
            target/repo-metadata
      - name: Upload to repo.wvlet.org
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          dest="s3://${R2_BUCKET}/${R2_PREFIX}"
          python3 .github/scripts/maven_repo.py check target/sona-staging "${dest}"
          aws s3 cp target/sona-staging/ "${dest}/" --recursive --exclude "*maven-metadata*"
          # Rebuilt from the version directories now in the bucket, so concurrent releases need no lock
          python3 .github/scripts/maven_repo.py metadata target/sona-staging "${dest}" target/repo-metadata
          aws s3 cp target/repo-metadata/ "${dest}/" --recursive --cache-control "no-cache"

  homebrew:
    name: Update homebrew-wvlet
    # The formula downloads the per-platform packages, so wait for all of them
    needs: [release, platform_packages]
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Need to acquire a token for other repository
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-wvlet
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v7
        with:
          # Need to specify the repository to set the write scope for git push
          repository: wvlet/homebrew-wvlet
          token: '${{ steps.app-token.outputs.token }}'
      - name: Setup git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>'
          git config --global push.default simple
      - name: Update VERSION
        run: |
          git switch -c releases/${{ github.ref_name }}
          VERSION=${GITHUB_REF_NAME#v}
          echo Version: $VERSION
          echo $VERSION > VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Push a release branch
        run: |
          git add VERSION
          git diff-index --quiet --cached HEAD || git commit -am "New release for wvlet ${VERSION}"
          git push --set-upstream origin releases/${{ github.ref_name }}
      - name: Create a PR to update version
        run: |
          gh pr create --repo="wvlet/homebrew-wvlet" \
          --title "Release wvlet $VERSION" \
          --body "Release wvlet [$VERSION](https://github.com/wvlet/wvlet/releases/tag/${{ github.ref_name }})"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}


