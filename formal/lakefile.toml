defaultTargets = ["WvletFormal", "activity-traces", "typer-traces", "model-build-traces", "sql-fold-traces", "rewrite-expr-traces"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "WvletFormal"

[[lean_exe]]
name = "activity-traces"
root = "Main"

[[lean_exe]]
name = "typer-traces"
root = "TyperTraces"

[[lean_exe]]
name = "model-build-traces"
root = "ModelBuildTraces"

[[lean_exe]]
name = "sql-fold-traces"
root = "SqlFoldTraces"

[[lean_exe]]
name = "rewrite-expr-traces"
root = "RewriteExprTraces"
